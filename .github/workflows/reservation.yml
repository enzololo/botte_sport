name: Reservation Volley Nantes
 
on:
  schedule:
    - cron: '50 14 * * 5'  
    - cron: '20 15 * * 5'
    - cron: '50 15 * * 5'
    - cron: '33 17 * * 5'
    - cron: '00 15 * * 3'
    - cron: '30 15 * * 3'
    - cron: '30 16 * * 3'
    - cron: '30 18 * * 3'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer Selenium
        run: pip install selenium

      - name: Lancer le robot
        run: python volley.py
        env:
          U_USER: ${{ secrets.U_USER }}
          U_PASS: ${{ secrets.U_PASS }}

      - name: Récupérer la photo en cas d'erreur
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-erreur
          path: |
            erreur_tentative_*.png
            page_tentative_*.html
          if-no-files-found: ignore
